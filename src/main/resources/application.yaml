spring:
  application:
    name: heating-service
    version: @project.version@
  profiles:
    active: home
  webflux:
    base-path: "/home/heating"
  reactor:
    # default LIMITED restores ThreadLocals only in "tap" and "handle", so traceId would be
    # missing from the MDC of every log statement inside a reactive chain
    context-propagation: auto
  rabbitmq:
    host: rabbitmq-headless
    port: 5672
    username: temperature
    # no default on purpose, like the password of the notifications below: with one the pod would
    # start, turn Ready and consume nothing. Without the variable the service does not start -
    # cholewa.required-properties sees to that, the binder alone would take the placeholder for the
    # password
    password: ${rabbitmq-password}
    virtual-host: /temperature
    connection-timeout: 10s
    requested-heartbeat: 10s
    template:
      # both default to false; without them the trace breaks at the queue between
      # amx-service, heating-service and notification-service
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
        # the listener returns a Mono; with the default AUTO mode the container acks before the
        # write even starts, so prefetch throttles nothing and the ack is sent twice
        acknowledge-mode: manual
        # how many messages are in flight at once, the rest waits in the broker. Above the
        # database pool size (2) on purpose: a message holds a connection only while its reading
        # is saved, and then calls the Shelly devices - with 1 a slow relay would hold up the
        # readings of every room
        prefetch: 3
  flyway:
    url: ${flyway-url:jdbc:postgresql://${database.host}:${database.port}/${database.name}}
    user: ${database-user:dummyUser}
    password: ${database-password:dummyPassword}
    enabled: on

database:
  host: ${database-host:localhost}
  port: ${database-port:5432}
  name: ${database-name:dummyName}
  username: ${database-user:dummyUser}
  password: ${database-password:dummyPassword}
  pool:
    # this service's share of the 22 backend connections the managed database allows
    # (heating 2 / database 4 / water 2 / presence 2, 12 free). 4 up to and including 1.6.0, 8
    # until 1.3.2. Sized so that a rollout, when the old and the new pod each hold a pool and
    # Flyway opens one more connection over JDBC, fits the budget even with all three rolling
    # services at once (HAS-169). Every operation takes a connection for one statement and
    # hands it back; with both in use the next one waits, and fails after max-acquire-time
    max-size: 2

server:
  port: 6200
management:
  server:
    port: 8200
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # default 0.1; a home system generates so little traffic that sampling everything is free,
      # and a partially sampled trace is useless when it is the only record of a request
      probability: 1.0

logbook:
  format:
    style: json

logging:
  structured:
    format:
      console: logstash
  level:
    org.zalando.logbook: trace

rabbitmq:
  queue:
    name: temperature.prod.heating

# the notification exchange is on the same broker as spring.rabbitmq.*, on its own virtual host;
# it is a headers exchange and "env" is one of the two headers it routes by.
# This group is the service's own, read by NotificationRabbitConfig for the second connection;
# cholewa.notification.enabled of cholewa-commons stays unset - the publisher it creates uses the
# connection of spring.rabbitmq.*, which leads to /temperature
notification:
  virtual-host: /notification
  username: notification
  # no default on purpose: with one the pod would start, turn Ready and fail every publish.
  # Without the variable the service does not start (cholewa.required-properties)
  password: ${notification-rabbitmq-password}
  exchange: notification
  env: prod

# the events of the devices (HAS-232): every MQTT client of the house publishes to amq.topic of
# /device, and the queue of this service there is bound with "#". The same broker as
# spring.rabbitmq.*, a third connection - DeviceRabbitConfig
device:
  virtual-host: /device
  username: device
  # no default on purpose: with one the pod would start, turn Ready and hear no window. Without the
  # variable the service does not start (cholewa.required-properties)
  password: ${device-rabbitmq-password}
  queue: device.prod.heating

# the services this one calls inside the cluster, over k8s DNS. A bare number of a timeout is
# seconds
internal:
  service:
    # the device registry: the opening sensors of the rooms and the BTHome gateways that hear them;
    # the calendar of the house, whose days off run the Sunday schedules (HAS-358)
    database:
      url: http://database-service:6200
      connect-timeout: 3s
      response-timeout: 5s

heating:
  sensor-monitor:
    cron: "0 0 * * * *"
    # a bare number is hours
    stale-after: 24h
    reminder-interval: 24h
    # rooms whose sensor is not reported, e.g. one taken out of service: [sauna, garden]
    muted-rooms: []
  # the window and door sensors of the rooms (HAS-232); a bare number is minutes
  window:
    # a window or a door open this long holds the heating of its room (owner, 2026-10-17); 1 min to 1 h
    hold-after: PT3M
    # how long the state of a sensor stands without its gateway confirming it; the gateways are read
    # every 5 min, so 10 min to 24 h
    gateway-silent-after: PT30M

shelly:
  actor:
    scheme: http
    port: 80
    pro4:
      down_left:
        host: 10.78.30.39
      down_right:
        host: 10.78.30.19
      up_left:
        host: 10.78.30.89
      up_right:
        host: 10.78.30.26
    relay:
      heater:
        office: 3
        tobi: 2
        livia: 1
        bedroom: 0
        bathroom_up: 3
        living_room: 1
        cinema: 1
        bathroom_down: 3
        entrance: 0
        garage: 2
      floor:
        wardrobe: 2
        bathroom_up: 1
        living_room: 0
        bathroom_down: 2

# what has no default in this document: a pod without one of them does not start (cholewa-commons,
# checked before the first bean is created)
cholewa:
  required-properties:
    - property: spring.rabbitmq.password
      variable: rabbitmq-password
    - property: notification.password
      variable: notification-rabbitmq-password
    - property: device.password
      variable: device-rabbitmq-password

---

spring:
  config:
    activate:
      on-profile: local
  rabbitmq:
    host: localhost
    # a run on a workstation starts without the three variables of the broker; it takes the real
    # passwords only to consume readings or device events, or to publish a notification
    password: ${rabbitmq-password:dummyPassword}

server:
  port: 6002
management:
  server:
    port: 8002

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""

rabbitmq:
  queue:
    name: temperature.dev.heating

notification:
  password: ${notification-rabbitmq-password:dummyPassword}
  env: dev

device:
  password: ${device-rabbitmq-password:dummyPassword}
  queue: device.dev.heating

internal:
  service:
    database:
      url: http://localhost:6005

---

spring:
  config:
    activate:
      on-profile: test
  # a context test starts the listener and the two runners that read the database: everything
  # that leads out of the JVM points at an address nothing listens on, so that a test cannot
  # reach the broker, the database or a relay even where their names resolve
  rabbitmq:
    host: localhost
    port: 1
    password: dummyPassword
  flyway:
    enabled: false

database:
  host: localhost
  port: 1

rabbitmq:
  queue:
    name: temperature.test.heating

# "test" matches no binding of the exchange: such a message would come back as unroutable
notification:
  password: dummyPassword
  env: test

device:
  password: dummyPassword
  queue: device.test.heating

internal:
  service:
    database:
      url: http://localhost:1

shelly:
  actor:
    port: 1
    pro4:
      down_left:
        host: localhost
      down_right:
        host: localhost
      up_left:
        host: localhost
      up_right:
        host: localhost

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""
